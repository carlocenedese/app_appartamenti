name: Build

# Builds the installers for Windows and macOS. It starts only on a version tag (v*) or by hand
# (Actions, Build, Run workflow), never on a push: macOS minutes cost ten times the Linux ones on
# private repositories, and a Tauri build is the slowest job we have.
# The installers are not signed: see apps/desktop/README.md for how to open them.
# On a tag it also signs the update files with the TAURI_SIGNING_PRIVATE_KEY secret and publishes
# a GitHub release with latest.json (job publish; docs/distribuzione.md). By hand it only builds
# test installers, kept as artifacts of the run, without update files.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: bollette-windows
            rust-targets: ''
            # --bundles is explicit so that a run never tries a format of the other system.
            tauri-args: --bundles msi,nsis
          - os: macos-latest
            artifact: bollette-macos
            # Universal binary: one app for Apple Silicon and Intel Macs.
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --bundles dmg,app
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # The version comes from "packageManager" in package.json.

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # On a tag, stop before the long build when the installer could never update itself:
      # versions, public key, updater plugin, signing secret (scripts/release.mjs).
      - name: Check that the version can be published
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: node scripts/release.mjs preflight "$GITHUB_REF_NAME"

      # The address of latest.json comes from the name of this repository, so that no account
      # name is written in the repository. Merged into tauri.conf.json by `tauri build --config`.
      - name: Prepare the update configuration
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          conf="$RUNNER_TEMP/release.conf.json"
          printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"endpoints":["https://github.com/%s/releases/latest/download/latest.json"]}}}\n' "$GITHUB_REPOSITORY" > "$conf"
          echo "RELEASE_CONFIG_ARGS=--config $conf" >> "$GITHUB_ENV"

      # The action takes the toolchain from its "toolchain" input when it is pinned by commit
      # (the master branch); with a tag or branch name it would take it from the name.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tests and licence checks run once, on the Windows job: ci.yml already tests every system,
      # and a macOS minute costs ten Linux ones on private repositories.
      - name: Test
        if: runner.os == 'Windows'
        run: pnpm test

      - name: Check dependency licences
        if: runner.os == 'Windows'
        run: pnpm licenses:check

      - name: Install cargo-deny
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny@0.20.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check Rust dependency licences
        if: runner.os == 'Windows'
        run: cargo deny --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --config deny.toml check licenses

      # Downloads the python-build-standalone interpreter of python/runtime.json, checks its
      # SHA-256 before extracting it, and installs bollette_pdf with its pinned dependencies into
      # apps/desktop/src-tauri/resources/python/, which tauri.conf.json bundles. The macOS one is
      # for Apple Silicon only (macos-aarch64), also inside the universal app.
      - name: Bundle the Python interpreter
        run: node scripts/bundle-python.mjs

      # The signing key reaches only the tagged build; the Tauri CLI assumes an empty password
      # when none is given and stdin is not a terminal (the key of R31 has none).
      - name: Build the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: pnpm --filter desktop tauri build ${{ matrix.tauri-args }} ${{ env.RELEASE_CONFIG_ARGS }} -- --locked

      # The NSIS installer, run silently, installs for the current user into
      # %LOCALAPPDATA%\App Bollette: a path with a space, as on the computers of the users.
      - name: Check the bundled Python in the installed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $python = Join-Path $env:LOCALAPPDATA 'App Bollette\python\python.exe'
          if ($python -notmatch ' ') { throw 'The path of the check must contain a space.' }
          if (-not (Test-Path -LiteralPath $python)) { throw "Bundled Python not found: $python" }
          & $python -I -m bollette_pdf --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The path inside the app ("App Bollette.app") has a space too.
      - name: Check the bundled Python in the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/App Bollette.app"
          "$app/Contents/Resources/python/bin/python3" -I -m bollette_pdf --version

      # The language data of the OCR is a resource next to python/ (macOS only, R85).
      - name: Check the OCR language data in the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/App Bollette.app"
          test -s "$app/Contents/Resources/ocr-data/ita.traineddata"

      # The licence texts of the native OCR libraries (tesserocr/.dylibs) travel with them (I4).
      - name: Check the licence texts of the OCR libraries in the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/App Bollette.app"
          texts=$(find "$app/Contents/Resources/python" -path '*bollette_pdf/licenses/ocr-native-libraries.txt')
          test -n "$texts"
          for name in Tesseract Leptonica libpng libjpeg-turbo libtiff libwebp liblzma Zstandard; do
            grep -q "^## $name" "$texts"
          done

      # The engine really loads from the built app (a wrong-architecture wheel, a dylib that does
      # not load, a macOS older than the module's minimum would all leave it silently off, I5):
      # a synthetic scanned page is read with the bundled interpreter and the bundled data.
      - name: Run the OCR from the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/App Bollette.app"
          "$app/Contents/Resources/python/bin/python3" -I python/tools/ocr_smoke.py --ocr-data "$app/Contents/Resources/ocr-data"

      - name: Collect the Windows installers
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bundle=apps/desktop/src-tauri/target/release/bundle
          mkdir installers
          cp "$bundle"/msi/*.msi installers/
          cp "$bundle"/nsis/*.exe installers/

      # The app is a folder, and a zip file loses the permission bits of the program inside it:
      # it goes into the artifact as a tar archive. The .dmg contains the same app.
      - name: Collect the macOS installers
        if: runner.os == 'macOS'
        run: |
          bundle=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          mkdir installers
          cp "$bundle"/dmg/*.dmg installers/
          tar -czf installers/App-Bollette.app.tar.gz -C "$bundle/macos" "App Bollette.app"

      # The Cargo.lock cargo made for this run, to be committed after the first green build (see
      # apps/desktop/README.md, "Punti aperti").
      - name: Upload the generated Cargo.lock
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lock
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: warn

      - name: Upload the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: installers/
          if-no-files-found: error

      # The files of the release, with names without spaces (GitHub would turn a space into a dot)
      # as scripts/release.mjs expects them. Windows: only the NSIS installer, which installs for
      # the current user without administrator rights; it is also the file the updater runs.
      - name: Collect the files to publish
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          if [ "$RUNNER_OS" = Windows ]; then
            nsis=apps/desktop/src-tauri/target/release/bundle/nsis
            for suffix in '' .sig; do
              cp "$nsis/App Bollette_${version}_x64-setup.exe$suffix" "release/App-Bollette_${version}_x64-setup.exe$suffix"
            done
          else
            bundle=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
            for suffix in '' .sig; do
              cp "$bundle/macos/App Bollette.app.tar.gz$suffix" "release/App-Bollette_${version}_universal.app.tar.gz$suffix"
            done
            cp "$bundle/dmg/App Bollette_${version}_universal.dmg" "release/App-Bollette_${version}_universal.dmg"
          fi

      - name: Upload the files to publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.artifact }}
          path: release/
          if-no-files-found: error

  # Only after both builds succeed. This job has the write permission and no signing key; the
  # build jobs have the key and no write permission.
  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download the files to publish
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # Checks names, signatures and sizes, then writes latest.json and SHA256SUMS.
      - name: Write the update manifest
        run: >
          node scripts/release.mjs manifest release "$GITHUB_REF_NAME"
          "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"

      # Published at once (ruling R273): pushing the tag is already the decision. latest.json
      # of the newest release is what every installed app reads.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "App Bollette $version" \
            --notes "Windows: scaricare App-Bollette_${version}_x64-setup.exe. Mac con Apple Silicon: App-Bollette_${version}_universal.dmg. Istruzioni per la prima apertura in docs/distribuzione.md del repository."
