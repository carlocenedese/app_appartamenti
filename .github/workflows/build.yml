name: Build

# Builds the installers for Windows and macOS. It starts only on a version tag (v*) or by hand
# (Actions, Build, Run workflow), never on a push: macOS minutes cost ten times the Linux ones on
# private repositories, and a Tauri build is the slowest job we have.
# The installers are not signed: see apps/desktop/README.md for how to open them.
# On a pushed v* tag it also publishes a release (docs/distribuzione.md): the builds run without
# any key; the job sign, in the environment `release` (user1 approves it, its secret
# TAURI_SIGNING_PRIVATE_KEY exists only there), signs the two update files with `tauri signer
# sign`; the job publish checks the signatures and publishes. By hand (Run workflow, on any ref)
# it only builds test installers, kept as artifacts of the run, and never publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: bollette-windows
            rust-targets: ''
            # --bundles is explicit so that a run never tries a format of the other system.
            tauri-args: --bundles msi,nsis
          - os: macos-latest
            artifact: bollette-macos
            # Universal binary: one app for Apple Silicon and Intel Macs.
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin --bundles dmg,app
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # The version comes from "packageManager" in package.json.

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # On a release, stop before the long build when the installer could never update itself:
      # versions, public key, signed versions, updater plugin (scripts/release.mjs).
      - name: Check that the version can be published
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/release.mjs preflight "$GITHUB_REF_NAME"

      # The address of latest.json comes from the name of this repository, so that no account
      # name is written in the repository. Merged into tauri.conf.json by `tauri build --config`.
      - name: Prepare the update configuration
        shell: bash
        run: >
          printf '{"plugins":{"updater":{"endpoints":["https://github.com/%s/releases/latest/download/latest.json"]}}}\n'
          "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release.conf.json"

      # The action takes the toolchain from its "toolchain" input when it is pinned by commit
      # (the master branch); with a tag or branch name it would take it from the name.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tests and licence checks run once, on the Windows job: ci.yml already tests every system,
      # and a macOS minute costs ten Linux ones on private repositories.
      - name: Test
        if: runner.os == 'Windows'
        run: pnpm test

      - name: Check dependency licences
        if: runner.os == 'Windows'
        run: pnpm licenses:check

      - name: Install cargo-deny
        if: runner.os == 'Windows'
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny@0.20.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check Rust dependency licences
        if: runner.os == 'Windows'
        run: cargo deny --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --config deny.toml check licenses

      # Downloads the python-build-standalone interpreter of python/runtime.json, checks its
      # SHA-256 before extracting it, and installs bollette_pdf with its pinned dependencies into
      # apps/desktop/src-tauri/resources/python/, which tauri.conf.json bundles. The macOS one is
      # for Apple Silicon only (macos-aarch64), also inside the universal app.
      - name: Bundle the Python interpreter
        run: node scripts/bundle-python.mjs

      # No signing key here: the update files are signed later, in the job sign.
      - name: Build the installers
        shell: bash
        env:
          TAURI_ARGS: ${{ matrix.tauri-args }}
        # TAURI_ARGS unquoted on purpose: it holds several arguments.
        run: pnpm --filter desktop tauri build $TAURI_ARGS --config "$RUNNER_TEMP/release.conf.json" -- --locked

      # The NSIS installer, run silently, installs for the current user into
      # %LOCALAPPDATA%\App Bollette: a path with a space, as on the computers of the users.
      - name: Check the bundled Python in the installed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $python = Join-Path $env:LOCALAPPDATA 'App Bollette\python\python.exe'
          if ($python -notmatch ' ') { throw 'The path of the check must contain a space.' }
          if (-not (Test-Path -LiteralPath $python)) { throw "Bundled Python not found: $python" }
          & $python -I -m bollette_pdf --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The path inside the app ("App Bollette.app") has a space too.
      - name: Check the bundled Python in the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/App Bollette.app"
          "$app/Contents/Resources/python/bin/python3" -I -m bollette_pdf --version

      # The language data of the OCR is a resource next to python/ (macOS only, R85).
      - name: Check the OCR language data in the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/App Bollette.app"
          test -s "$app/Contents/Resources/ocr-data/ita.traineddata"

      # The licence texts of the native OCR libraries (tesserocr/.dylibs) travel with them (I4).
      - name: Check the licence texts of the OCR libraries in the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/App Bollette.app"
          texts=$(find "$app/Contents/Resources/python" -path '*bollette_pdf/licenses/ocr-native-libraries.txt')
          test -n "$texts"
          for name in Tesseract Leptonica libpng libjpeg-turbo libtiff libwebp liblzma Zstandard; do
            grep -q "^## $name" "$texts"
          done

      # The engine really loads from the built app (a wrong-architecture wheel, a dylib that does
      # not load, a macOS older than the module's minimum would all leave it silently off, I5):
      # a synthetic scanned page is read with the bundled interpreter and the bundled data.
      - name: Run the OCR from the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/App Bollette.app"
          "$app/Contents/Resources/python/bin/python3" -I python/tools/ocr_smoke.py --ocr-data "$app/Contents/Resources/ocr-data"

      - name: Collect the Windows installers
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bundle=apps/desktop/src-tauri/target/release/bundle
          mkdir installers
          cp "$bundle"/msi/*.msi installers/
          cp "$bundle"/nsis/*.exe installers/

      # The app is a folder, and a zip file loses the permission bits of the program inside it:
      # it goes into the artifact as a tar archive. The .dmg contains the same app.
      - name: Collect the macOS installers
        if: runner.os == 'macOS'
        run: |
          bundle=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          mkdir installers
          cp "$bundle"/dmg/*.dmg installers/
          tar -czf installers/App-Bollette.app.tar.gz -C "$bundle/macos" "App Bollette.app"

      # The Cargo.lock cargo made for this run, to be committed after the first green build (see
      # apps/desktop/README.md, "Punti aperti").
      - name: Upload the generated Cargo.lock
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lock
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: warn

      - name: Upload the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: installers/
          if-no-files-found: error

      # The files of the release, unsigned, with names without spaces (GitHub would turn a space
      # into a dot) as scripts/release.mjs expects them. Windows: only the NSIS installer, which
      # installs for the current user without administrator rights; the updater runs it too.
      # macOS: the update archive is the .app in a tar.gz, the same one collected above.
      - name: Collect the files to publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release
          if [ "$RUNNER_OS" = Windows ]; then
            cp "apps/desktop/src-tauri/target/release/bundle/nsis/App Bollette_${version}_x64-setup.exe" "release/App-Bollette_${version}_x64-setup.exe"
          else
            cp installers/App-Bollette.app.tar.gz "release/App-Bollette_${version}_universal.app.tar.gz"
            cp "apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/App Bollette_${version}_universal.dmg" "release/App-Bollette_${version}_universal.dmg"
          fi

      - name: Upload the files to publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.artifact }}
          path: release/
          if-no-files-found: error

  # Before the job sign enters the environment `release`: GitHub would create a missing one by
  # itself, with no reviewer and no filter, so this job (outside any environment) stops the run
  # unless `release` exists, has a required reviewer and admits only v* tags (release.mjs
  # environment, GET only). Any failure to read counts as unprotected (fail closed). A consistency
  # check, not a replacement of the settings: whoever can change this file can drop it.
  guard:
    name: guard
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check that the environment release is protected
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs environment "$GITHUB_REPOSITORY"

  # The only job that sees the signing key: a secret of the environment `release`, which waits
  # for user1's approval and admits only v* tags (docs/distribuzione.md). Short on purpose: it
  # signs two files that the builds made, binding each signature to the version
  # (requireSignedVersion), and has no write permission.
  sign:
    name: sign
    needs: [build, guard]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Only the desktop app and its Tauri CLI, installed before the key is in any environment.
      - name: Install the Tauri CLI
        run: pnpm install --frozen-lockfile --filter desktop

      - name: Download the files to publish
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # The key has a password (user1, 18 November 2026): secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      # of the same environment. stdin is closed, so the CLI never waits for a prompt.
      - name: Sign the update files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Manca il secret TAURI_SIGNING_PRIVATE_KEY dell'environment release: vedi docs/distribuzione.md." >&2
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "Manca il secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD dell'environment release: vedi docs/distribuzione.md." >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          for file in "App-Bollette_${version}_x64-setup.exe" "App-Bollette_${version}_universal.app.tar.gz"; do
            pnpm --filter desktop tauri signer sign --app-version "$version" "$PWD/release/$file" < /dev/null
          done

      - name: Upload the signed files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: release/
          if-no-files-found: error

  # Only after the signature. This job has the write permission and no signing key.
  publish:
    name: publish
    needs: sign
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Download the files to publish
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: release

      # Checks names, sizes and every signature against the public key of tauri.conf.json, then
      # writes latest.json and SHA256SUMS.
      - name: Write the update manifest
        run: >
          node scripts/release.mjs manifest release "$GITHUB_REF_NAME"
          "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"

      # Published at once, after user1 approved the job sign (R273). latest.json of the newest
      # release is what every installed app reads.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "App Bollette $version" \
            --notes "Windows: scaricare App-Bollette_${version}_x64-setup.exe e aprirlo; se compare «Windows ha protetto il PC», scegliere «Maggiori informazioni», poi «Esegui comunque». Mac con Apple Silicon: App-Bollette_${version}_universal.dmg (tasto destro, Apri). Gli aggiornamenti successivi li propone l'app."
