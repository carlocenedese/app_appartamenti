name: Cargo.lock

# Keeps apps/desktop/src-tauri/Cargo.lock in step with Cargo.toml without Rust on anyone's
# computer (plan 16b, docs/distribuzione.md). It runs by itself on every push, on any branch, that
# changes Cargo.toml or Cargo.lock (a new workflow_dispatch cannot be started from a branch until
# the file is on main), and by hand. It never pushes: it uploads the lock as the artifact
# `cargo-lock` and fails when the committed one was out of date, so red means «download the
# artifact and commit it». build.yml builds with --locked and would fail on a stale lock.
on:
  push:
    # Branches only: path filters are not applied to tag pushes, so v* tags would start it too.
    branches: ['**']
    paths:
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src-tauri/Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable

      # Without --locked, cargo adds what Cargo.toml asks and is missing and keeps every other
      # version as it is (no `cargo update`, which would move the whole tree). Nothing is built.
      - name: Bring Cargo.lock in step with Cargo.toml
        run: cargo metadata --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml > /dev/null

      - name: Install cargo-deny
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny@0.20.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # A new licence is user1's decision: deny.toml is not changed to make this pass.
      - name: Check Rust dependency licences
        run: cargo deny --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --config deny.toml check licenses

      - name: Upload Cargo.lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-lock
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: error

      - name: Check that the committed Cargo.lock was up to date
        run: |
          git diff --stat -- apps/desktop/src-tauri/Cargo.lock
          if ! git diff --quiet -- apps/desktop/src-tauri/Cargo.lock; then
            echo "Cargo.lock non è aggiornato: scaricare l'artifact cargo-lock e committarlo (docs/distribuzione.md, punto 3)." >&2
            exit 1
          fi
