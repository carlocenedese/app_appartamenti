name: CI

# Every push runs on Ubuntu only. Pull requests to main and the nightly run repeat the checks on
# Windows and macOS too (macOS minutes cost ten times the Linux ones on private repositories).
on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # The version comes from "packageManager" in package.json.

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test with TZ=Pacific/Auckland
        if: runner.os == 'Linux'
        env:
          TZ: Pacific/Auckland
        run: pnpm test

      - name: Test with TZ=America/Los_Angeles
        if: runner.os == 'Linux'
        env:
          TZ: America/Los_Angeles
        run: pnpm test

      - name: Check dependency licences
        run: pnpm licenses:check

      # Python 3.13: on 3.12 the referencing library needs typing-extensions (PSF-2.0, not allowed).
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r python/requirements.txt

      - name: Test the Python package
        run: pnpm python:test

      - name: Check Python dependency licences
        run: pnpm python:licenses

      - name: Check for personal data
        run: pnpm data:check
