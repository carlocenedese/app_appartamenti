name: CI

# Every push runs on Ubuntu only. Pull requests to main and the nightly run repeat the checks on
# Windows and macOS too (macOS minutes cost ten times the Linux ones on private repositories).
on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # The integration test of the core with the Python reader fails instead of being skipped.
      REQUIRE_PYTHON: '1'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # The version comes from "packageManager" in package.json.

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Python 3.13: on 3.12 the referencing library needs typing-extensions (PSF-2.0, not allowed).
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r python/requirements.txt

      # Makes `python -I -m bollette_pdf` find the package of the working tree (a .pth file, no
      # setuptools: ruling R72), for the integration test of the core.
      - name: Install the Python package for the core tests
        run: pnpm python:dev-install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # The web part of the desktop app as the installer gets it (vite build).
      - name: Build the desktop web app
        run: pnpm --filter desktop build

      - name: Test
        run: pnpm test

      - name: Test with TZ=Pacific/Auckland
        if: runner.os == 'Linux'
        env:
          TZ: Pacific/Auckland
        run: pnpm test

      - name: Test with TZ=America/Los_Angeles
        if: runner.os == 'Linux'
        env:
          TZ: America/Los_Angeles
        run: pnpm test

      - name: Check dependency licences
        run: pnpm licenses:check

      - name: Test the Python package
        if: runner.os != 'macOS'
        run: pnpm python:test

      # OCR runs on macOS only (R85): the language data is fetched with the project's own script,
      # checked against its SHA-256, and the tests of the real engine fail instead of being skipped.
      - name: Fetch the OCR language data (macOS)
        if: runner.os == 'macOS'
        run: >
          node --input-type=module -e
          "import { fetchOcrData, OCR_DATA } from './scripts/ocr-data.mjs';
          await fetchOcrData(process.env.RUNNER_TEMP + '/ocr-data', OCR_DATA.url, OCR_DATA.sha256);"

      - name: Test the Python package with the real OCR engine (macOS)
        if: runner.os == 'macOS'
        env:
          REQUIRE_OCR: '1'
          BOLLETTE_OCR_TEST_DATA: ${{ runner.temp }}/ocr-data
        run: pnpm python:test

      - name: Check Python dependency licences
        run: pnpm python:licenses

      - name: Check for personal data
        run: pnpm data:check

      # The tests of tools/ (anonymise.py). `python3` is not on the Windows runners.
      - name: Test the tools
        if: runner.os != 'Windows'
        run: pnpm tools:test

  # Known vulnerabilities in what the app ships (S5 of the security review of 18 November 2026).
  # Blocking. npm: only high and critical advisories of production dependencies. pip and Cargo:
  # any known vulnerability (pip-audit and cargo-deny have no severity filter; deny.toml leaves
  # unmaintained crates out).
  # A false positive is silenced in the repository, with a reason, never by removing the step:
  # npm: `pnpm audit --ignore <GHSA-...>` once on a computer, which writes the id in
  # pnpm-workspace.yaml (auditConfig.ignoreGhsas), committed with a comment; pip with
  # `--ignore-vuln <ID>` on the pip-audit line; Cargo in deny.toml ([advisories] ignore).
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Audit the npm production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # pip-audit (Apache-2.0) is a tool of this job only, in its own virtualenv: never in the
      # package or in python/requirements.txt. It reads the pinned, hashed list without installing it.
      - name: Audit the Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install --quiet pip-audit==2.10.1
          "$RUNNER_TEMP/audit/bin/pip-audit" --require-hashes --disable-pip --progress-spinner off -r python/requirements.txt

      # As in cargo-lock.yml: cargo-deny reads Cargo.lock through cargo metadata, nothing is built.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Audit the Rust dependencies
        run: cargo deny --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --config deny.toml check advisories

  # Pull requests only: the Rust app compiles with the committed Cargo.lock and its crate licences
  # pass deny.toml. The steps run only when the Rust app, a Cargo file or deny.toml changes;
  # otherwise the job is green at once, so it can be a required check. Windows, like the release
  # build: on Linux Tauri needs the WebKitGTK system libraries.
  rust:
    name: rust
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The base branch too, to see what the pull request changes.
          fetch-depth: 0

      - name: Look for changes to the Rust app
        id: changes
        shell: bash
        # The list first, then grep: with pipefail, grep -q closing the pipe early could fail it.
        run: |
          changed=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")
          if grep -qE '^apps/desktop/src-tauri/|(^|/)Cargo\.(toml|lock)$|^deny\.toml$' <<< "$changed"; then
            echo rust=true >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        if: steps.changes.outputs.rust == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        if: steps.changes.outputs.rust == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Rust
        if: steps.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable

      - name: Cache Rust build output
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      # generate_context! embeds the web app (frontendDist) and tauri-build looks for the bundled
      # resources: the web app is built, the resource folders get a placeholder (nothing is bundled).
      - name: Prepare what the Rust build reads
        if: steps.changes.outputs.rust == 'true'
        shell: bash
        run: |
          pnpm install --frozen-lockfile --filter desktop...
          pnpm --filter desktop build
          for folder in python seed-profiles ocr-data; do
            mkdir -p "apps/desktop/src-tauri/resources/$folder"
            touch "apps/desktop/src-tauri/resources/$folder/.placeholder"
          done

      - name: Check that the Rust app compiles
        if: steps.changes.outputs.rust == 'true'
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Install cargo-deny
        if: steps.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-deny@0.20.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check Rust licences
        if: steps.changes.outputs.rust == 'true'
        run: cargo deny --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --config deny.toml check licenses
