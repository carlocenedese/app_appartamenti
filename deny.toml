# Licences of the Rust crates in the desktop app (apps/desktop/src-tauri), checked by
# `cargo deny ... check licenses` in .github/workflows/build.yml. The npm packages are checked by
# `pnpm licenses:check`; this file applies the same rule to crates (spec section 40).
# Format: cargo-deny 0.20 (https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html).

[graph]
# Only what the installers contain: Windows, and macOS on Apple Silicon and Intel.
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]

[licenses]
# Everything that is not listed is refused. That includes GPL, AGPL and LGPL (never allowed) and
# every other licence nobody has decided on yet: see "Punti aperti" in apps/desktop/README.md.
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "CC0-1.0",
  "Unlicense",
  "BlueOak-1.0.0",
  # Added by user1 on 11 November 2026, with Zlib below: both are permissive and the Rust tree of
  # Tauri carries them (unicode-ident has Unicode-3.0 in its licence expression, foldhash is Zlib).
  # scripts/check-licenses.mjs allows them for npm packages too, so the two lists stay the same.
  "Unicode-3.0",
  "Zlib",
  # Weak copyleft at file level. Tauri's own dependencies carry it (for example cssparser and
  # selectors). We use those crates unmodified, so our own code stays ours; what MPL-2.0 still
  # asks (section 3.2) is that whoever receives the app is told where the source of those files
  # is, and pointing to the upstream source (crates.io, the projects' repositories) is enough.
  # pnpm licenses:check still refuses MPL-2.0 for npm packages.
  "MPL-2.0",
]

# The app's own crate has no licence field and is never published (publish = false).
private = { ignore = true }

# The list is a policy, not an inventory: do not warn about entries no crate uses right now.
unused-allowed-license = "allow"

# Known vulnerabilities (RustSec), checked by `cargo deny ... check advisories` in the job rust of
# .github/workflows/ci.yml. Every vulnerability is an error (cargo-deny has no severity filter);
# unmaintained crates are not, because Tauri's own tree carries some and only a vulnerability
# needs action. A false positive goes in `ignore`, with a reason and an expiry:
#   ignore = [{ id = "RUSTSEC-0000-0000", reason = "...", expiry = "2027-06-30" }]
[advisories]
unmaintained = "none"
unsound = "workspace"
yanked = "warn"
