<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <title>App del telefono, sola lettura - Proposta 02, Minimale svizzero</title>
  <style>
    text { font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0A0A0A; }
    .g { fill: #5C5C5C; }
    .w { fill: #FFFFFF; }
    .r { fill: #D40511; }
    .b { font-weight: 700; }
    .sb { font-weight: 600; }
    .hair { stroke: #DADAD6; stroke-width: 1; }
    .rule { stroke: #0A0A0A; stroke-width: 2; }
    .num { font-feature-settings: 'tnum'; }
  </style>
  <rect width="390" height="844" fill="#FFFFFF"/>

  <!-- Barra di stato -->
  <text x="32" y="24" font-size="15" class="b">9:41</text>
  <rect x="338" y="13" width="22" height="11" rx="2" fill="none" stroke="#0A0A0A"/>
  <rect x="340" y="15" width="15" height="7" fill="#0A0A0A"/>
  <rect x="361" y="16" width="2" height="5" fill="#0A0A0A"/>

  <!-- Intestazione -->
  <text x="20" y="64" font-size="17" class="b" letter-spacing="-0.3">Bollette</text>
  <circle cx="232" cy="59" r="3.5" fill="#007A3D"/>
  <text x="370" y="64" font-size="12" class="g" text-anchor="end">Sola lettura · alle 09:42</text>

  <text x="19" y="114" font-size="32" class="b" letter-spacing="-0.4">Buongiorno, Carlo.</text>
  <text x="20" y="140" font-size="15">Lovarini e Pulci chiedono attenzione.</text>

  <!-- Appartamenti -->
  <line x1="20" y1="169" x2="370" y2="169" class="rule"/>
  <text x="20" y="194" font-size="13" class="b">Appartamenti</text>
  <text x="370" y="194" font-size="12" class="g" text-anchor="end">Saldo di cassa</text>

  <text x="20" y="232" font-size="20" class="b">Berchet</text>
  <circle cx="26" cy="251" r="6" fill="#007A3D"/>
  <path d="M23 251 l2.2 2.2 l4 -4.4" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
  <text x="40" y="256" font-size="14">Tutto a posto</text>
  <text x="370" y="234" font-size="22" class="b num" text-anchor="end">€ 1.284,50</text>
  <text x="370" y="256" font-size="12" class="g" text-anchor="end">5 su 5 in regola</text>
  <line x1="20" y1="276.5" x2="370" y2="276.5" class="hair"/>

  <text x="20" y="304" font-size="20" class="b">Lovarini</text>
  <path d="M26 316 l7 13 h-14 z" fill="#B57F00"/>
  <text x="26" y="327.5" font-size="9" class="b w" text-anchor="middle">!</text>
  <text x="40" y="328" font-size="14">2 cose da fare</text>
  <text x="370" y="306" font-size="22" class="b num" text-anchor="end">€ 742,10</text>
  <text x="370" y="328" font-size="12" class="g" text-anchor="end">3 su 4 in regola</text>
  <line x1="20" y1="348.5" x2="370" y2="348.5" class="hair"/>

  <text x="20" y="376" font-size="20" class="b">Pulci</text>
  <rect x="20" y="389" width="12" height="12" fill="#D40511"/>
  <text x="26" y="399" font-size="10" class="b w" text-anchor="middle">!</text>
  <text x="40" y="400" font-size="14" class="sb r">1 scadenza passata</text>
  <text x="370" y="378" font-size="22" class="b num" text-anchor="end">- € 63,00</text>
  <text x="370" y="400" font-size="12" class="g" text-anchor="end">4 su 4 in regola</text>
  <line x1="20" y1="420.5" x2="370" y2="420.5" class="hair"/>

  <!-- Prossime scadenze -->
  <line x1="20" y1="441" x2="370" y2="441" class="rule"/>
  <text x="20" y="466" font-size="13" class="b">Prossime scadenze</text>

  <text x="20" y="502" font-size="15" class="b num r">31/10</text>
  <text x="76" y="502" font-size="15" class="sb">Conguaglio Pulci</text>
  <rect x="76" y="511" width="10" height="10" fill="#D40511"/>
  <text x="81" y="519.5" font-size="8" class="b w" text-anchor="middle">!</text>
  <text x="92" y="520" font-size="12" class="r sb">Scaduto · da inviare</text>
  <line x1="20" y1="532.5" x2="370" y2="532.5" class="hair"/>

  <text x="20" y="558" font-size="15" class="b num">10/12</text>
  <text x="76" y="558" font-size="15" class="sb">Rata condominio Lovarini</text>
  <text x="76" y="576" font-size="12" class="g">Tra 29 giorni</text>
  <text x="370" y="558" font-size="15" class="num" text-anchor="end">€ 214,00</text>
  <line x1="20" y1="588.5" x2="370" y2="588.5" class="hair"/>

  <text x="20" y="614" font-size="15" class="b num">16/12</text>
  <text x="76" y="614" font-size="15" class="sb">TARI Pulci, 2ª rata</text>
  <text x="76" y="632" font-size="12" class="g">Tra 35 giorni</text>
  <text x="370" y="614" font-size="15" class="num" text-anchor="end">€ 101,04</text>
  <line x1="20" y1="644.5" x2="370" y2="644.5" class="hair"/>

  <!-- Chi ha pagato -->
  <line x1="20" y1="665" x2="370" y2="665" class="rule"/>
  <text x="20" y="690" font-size="13" class="b">Chi ha pagato a novembre</text>

  <text x="20" y="724" font-size="15" class="sb">Berchet</text>
  <g fill="#0A0A0A"><rect x="104" y="714" width="10" height="10"/><rect x="118" y="714" width="10" height="10"/><rect x="132" y="714" width="10" height="10"/><rect x="146" y="714" width="10" height="10"/><rect x="160" y="714" width="10" height="10"/></g>
  <text x="370" y="724" font-size="14" class="num" text-anchor="end">5 su 5</text>
  <line x1="20" y1="740.5" x2="370" y2="740.5" class="hair"/>

  <text x="20" y="764" font-size="15" class="sb">Lovarini</text>
  <g fill="#0A0A0A"><rect x="104" y="754" width="10" height="10"/><rect x="118" y="754" width="10" height="10"/><rect x="132" y="754" width="10" height="10"/></g>
  <rect x="146.5" y="754.5" width="9" height="9" fill="none" stroke="#0A0A0A"/>
  <text x="370" y="764" font-size="14" class="num" text-anchor="end">3 su 4 · manca Elena M.</text>
  <line x1="20" y1="780.5" x2="370" y2="780.5" class="hair"/>

  <text x="20" y="804" font-size="15" class="sb">Pulci</text>
  <g fill="#0A0A0A"><rect x="104" y="794" width="10" height="10"/><rect x="118" y="794" width="10" height="10"/><rect x="132" y="794" width="10" height="10"/><rect x="146" y="794" width="10" height="10"/></g>
  <text x="370" y="804" font-size="14" class="num" text-anchor="end">4 su 4</text>

  <!-- Indicatore home -->
  <rect x="128" y="830" width="134" height="5" rx="2.5" fill="#0A0A0A"/>
</svg>
