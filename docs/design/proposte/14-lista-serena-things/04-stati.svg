<text x="598" y="579" font-size="12.5" font-weight="500" fill="#AEB4BE" text-anchor="end">8 s</text>
<text x="64" y="622" font-size="12.5" font-weight="400" fill="#555B65">Resta 8 secondi in basso al centro; anche Ctrl Z annulla.</text>
