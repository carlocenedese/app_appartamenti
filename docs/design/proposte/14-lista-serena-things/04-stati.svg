<rect x="40" y="100" width="400" height="368" rx="16" fill="#FFFFFF"/><text x="64" y="132" font-size="12" font-weight="700" fill="#555B65" letter-spacing="0.6">A · DA RIVEDERE, VUOTO</text>
<circle cx="240" cy="210" r="38" fill="#E6EDFB"/><circle cx="240" cy="210" r="24" fill="#1D5BD6"/><path d="M231.4 210.4 L237.6 216.5 L249.2 203.9" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="240" y="284" font-size="20" font-weight="700" fill="#1B1E23" text-anchor="middle">Niente da rivedere</text>
<text x="240" y="312" font-size="14" font-weight="400" fill="#555B65" text-anchor="middle">Hai confermato tutto. Quando importi un</text>
<text x="240" y="332" font-size="14" font-weight="400" fill="#555B65" text-anchor="middle">nuovo estratto conto, le voci arrivano qui.</text>
<rect x="126" y="368" width="228" height="44" rx="11" fill="#1D5BD6"/>
<text x="240" y="396" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Importa un estratto conto</text>
<text x="240" y="444" font-size="12.5" font-weight="400" fill="#555B65" text-anchor="middle">Spunta piena e ferma: niente festa.</text>
<rect x="460" y="100" width="940" height="368" rx="16" fill="#FFFFFF"/><text x="484" y="132" font-size="12" font-weight="700" fill="#555B65" letter-spacing="0.6">B · ATTESA E SPUNTA, FOTOGRAMMI</text>
<text x="484" y="164" font-size="16" font-weight="600" fill="#1B1E23">Sto leggendo l’estratto conto…</text>
<text x="484" y="186" font-size="13" font-weight="400" fill="#555B65">Tre puntini si riempiono uno alla volta, poi ripartono (ciclo di 1,2 s).</text>
