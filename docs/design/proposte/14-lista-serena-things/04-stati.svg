<text x="116" y="714" font-size="17" font-weight="700" fill="#1B1E23">Il file non sembra un estratto conto</text>
<text x="116" y="738" font-size="13.5" font-weight="400" fill="#555B65">«scontrino_ottobre.pdf» non ha le colonne Data, Descrizione e Importo.</text>
<text x="116" y="758" font-size="13.5" font-weight="400" fill="#555B65">Prova con il PDF o il CSV scaricato dal sito della banca. Non è stato salvato nulla.</text>
