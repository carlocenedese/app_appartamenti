<text x="40" y="50" font-size="24" font-weight="700" fill="#1B1E23" letter-spacing="-0.4">14 · Lista serena — stati e micro-animazione</text>
<text x="40" y="76" font-size="14" font-weight="400" fill="#555B65">Ogni stato ha una forma propria; il colore viene dopo. Il blu è solo per le azioni.</text>
