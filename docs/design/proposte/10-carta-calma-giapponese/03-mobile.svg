<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="844" viewBox="0 0 390 844">
  <title>Carta calma — App del telefono, sola lettura</title>
  <defs>
    <style>
      .serif { font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', serif; }
      .sans  { font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; }
      .ink  { fill: #2B2620; }
      .ink2 { fill: #6B6257; }
      .moss { fill: #56663A; }
      .ocra { fill: #8C6418; }
      .kaki { fill: #A8532A; }
      .indigo { fill: #2F4A6B; }
      .rule { stroke: #D9CFBF; stroke-width: 1.1; fill: none; }
    </style>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0.09 0"/>
    </filter>
    <filter id="paperLow" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 0.07 0"/>
    </filter>
    <filter id="ink" filterUnits="userSpaceOnUse" x="0" y="0" width="390" height="844">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="sheet" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#5A4630" flood-opacity="0.09"/>
    </filter>
    <g id="i-ok">
      <circle r="8" fill="none" stroke="#56663A" stroke-width="1.5"/>
      <path d="M-3.6 0.4 L-0.9 3.1 L4 -2.6" fill="none" stroke="#56663A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="i-warn">
      <circle r="8" fill="none" stroke="#8C6418" stroke-width="1.5"/>
      <path d="M0 -8 A8 8 0 0 0 0 8 Z" fill="#8C6418"/>
    </g>
    <g id="i-err">
      <path d="M0 -8.5 L8.5 6.8 L-8.5 6.8 Z" fill="none" stroke="#A8532A" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M0 -2.6 L0 1.8" stroke="#A8532A" stroke-width="1.6" stroke-linecap="round"/>
      <circle cy="4.3" r="1" fill="#A8532A"/>
    </g>
  </defs>

  <rect width="390" height="844" fill="#F4EFE6"/>

  <!-- barra di stato del telefono -->
  <g class="sans">
    <text x="28" y="32" class="ink" font-size="15" font-weight="600">9:41</text>
    <rect x="330" y="21" width="24" height="12" rx="3" fill="none" stroke="#2B2620" stroke-width="1.2"/>
    <rect x="332.5" y="23.5" width="16" height="7" rx="1.5" fill="#2B2620"/>
    <rect x="355.5" y="25" width="2" height="4" rx="1" fill="#2B2620"/>
    <path d="M304 31 L304 28 M309 31 L309 25 M314 31 L314 22 M319 31 L319 19" stroke="#2B2620" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- intestazione -->
  <g class="sans">
    <text x="16" y="80" class="ink2" font-size="11.5" letter-spacing="1.4">MERCOLEDÌ 11 NOVEMBRE</text>
    <text x="16" y="112" class="serif ink" font-size="27" font-weight="600">Ciao, Nicola.</text>
    <rect x="262" y="90" width="112" height="28" rx="14" fill="#FBF8F2" stroke="#D9CFBF"/>
    <path d="M276 104 Q283 97 290 104 Q283 111 276 104 Z" fill="none" stroke="#6B6257" stroke-width="1.2"/>
    <circle cx="283" cy="104" r="1.8" fill="#6B6257"/>
    <text x="298" y="108.5" class="ink2" font-size="12">Sola lettura</text>
    <circle cx="20" cy="138" r="3.5" fill="#56663A"/>
    <text x="30" y="142" class="ink2" font-size="12.5">Aggiornato 2 min fa, dal computer di Carlo</text>
  </g>

  <!-- tre fogli -->
  <g class="sans">
    <g transform="translate(16 160)">
      <rect width="358" height="78" rx="4" fill="#FBF8F2" stroke="#E4DBCC" filter="url(#sheet)"/>
      <rect x="0" y="12" width="5" height="54" fill="#56663A" opacity="0.55"/>
      <text x="22" y="32" class="serif ink" font-size="19" font-weight="600">Berchet</text>
      <use xlink:href="#i-ok" x="30" y="55"/>
      <text x="44" y="60" class="moss" font-size="14" font-weight="600">Tutto a posto</text>
      <text x="340" y="32" text-anchor="end" class="ink2" font-size="12.5">5 su 5 in regola</text>
      <text x="340" y="60" text-anchor="end" class="ink" font-size="15" font-weight="600">€ 1.284,50</text>
    </g>
    <g transform="translate(16 250)">
      <rect width="358" height="78" rx="4" fill="#FBF8F2" stroke="#E4DBCC" filter="url(#sheet)"/>
      <rect x="0" y="12" width="5" height="54" fill="#C99A3C" opacity="0.75"/>
      <text x="22" y="32" class="serif ink" font-size="19" font-weight="600">Lovarini</text>
      <use xlink:href="#i-warn" x="30" y="55"/>
      <text x="44" y="60" class="ocra" font-size="14" font-weight="600">2 cose da fare</text>
      <text x="340" y="32" text-anchor="end" class="ink2" font-size="12.5">3 su 4 in regola</text>
      <text x="340" y="60" text-anchor="end" class="ink" font-size="15" font-weight="600">€ 642,10</text>
    </g>
    <g transform="translate(16 340)">
      <rect width="358" height="78" rx="4" fill="#FBF8F2" stroke="#E4DBCC" filter="url(#sheet)"/>
      <rect x="0" y="12" width="5" height="54" fill="#B8612A" opacity="0.6"/>
      <text x="22" y="32" class="serif ink" font-size="19" font-weight="600">Pulci</text>
      <use xlink:href="#i-err" x="30" y="55"/>
      <text x="44" y="60" class="kaki" font-size="14" font-weight="600">1 scadenza passata</text>
      <text x="340" y="32" text-anchor="end" class="ink2" font-size="12.5">4 su 4 in regola</text>
      <text x="340" y="60" text-anchor="end" class="ink" font-size="15" font-weight="600">- € 63,00</text>
    </g>
  </g>

  <!-- prossime scadenze -->
  <g class="sans">
    <text x="16" y="458" class="serif ink" font-size="19" font-weight="600">Prossime scadenze</text>

    <text x="38" y="490" text-anchor="middle" class="serif kaki" font-size="20" font-weight="600">31</text>
    <text x="38" y="505" text-anchor="middle" class="kaki" font-size="10" letter-spacing="1">OTT</text>
    <text x="72" y="489" class="ink" font-size="14.5">Conguaglio Pulci da inviare</text>
    <use xlink:href="#i-err" x="80" y="502"/>
    <text x="94" y="507" class="kaki" font-size="12.5" font-weight="600">Scaduto da 11 giorni</text>
    <path d="M16 522 L374 522" class="rule" filter="url(#ink)"/>

    <text x="38" y="546" text-anchor="middle" class="serif ink" font-size="20" font-weight="600">10</text>
    <text x="38" y="561" text-anchor="middle" class="ink2" font-size="10" letter-spacing="1">DIC</text>
    <text x="72" y="545" class="ink" font-size="14.5">Rata condominio Lovarini</text>
    <text x="374" y="545" text-anchor="end" class="ink" font-size="14.5">€ 312,00</text>
    <use xlink:href="#i-warn" x="80" y="558"/>
    <text x="94" y="563" class="ocra" font-size="12.5" font-weight="600">Tra 29 giorni</text>
    <path d="M16 578 L374 578" class="rule" filter="url(#ink)"/>

    <text x="38" y="602" text-anchor="middle" class="serif ink" font-size="20" font-weight="600">16</text>
    <text x="38" y="617" text-anchor="middle" class="ink2" font-size="10" letter-spacing="1">DIC</text>
    <text x="72" y="601" class="ink" font-size="14.5">IMU, saldo</text>
    <text x="374" y="601" text-anchor="end" class="ink" font-size="14.5">€ 486,00</text>
    <text x="72" y="619" class="ink2" font-size="12.5">Tutti gli appartamenti · programmata</text>
  </g>

  <!-- chi ha pagato -->
  <g class="sans">
    <text x="16" y="668" class="serif ink" font-size="19" font-weight="600">Chi ha pagato a novembre</text>

    <text x="16" y="702" class="ink" font-size="14" font-weight="600">Berchet</text>
    <g font-size="11" text-anchor="middle" font-weight="600">
      <circle cx="112" cy="697" r="12" fill="#EEF0E4" stroke="#56663A" stroke-width="1.2"/><text x="112" y="701" class="moss">D</text>
      <circle cx="142" cy="697" r="12" fill="#EEF0E4" stroke="#56663A" stroke-width="1.2"/><text x="142" y="701" class="moss">M</text>
      <circle cx="172" cy="697" r="12" fill="#EEF0E4" stroke="#56663A" stroke-width="1.2"/><text x="172" y="701" class="moss">S</text>
      <circle cx="202" cy="697" r="12" fill="#EEF0E4" stroke="#56663A" stroke-width="1.2"/><text x="202" y="701" class="moss">L</text>
      <circle cx="232" cy="697" r="12" fill="#EEF0E4" stroke="#56663A" stroke-width="1.2"/><text x="232" y="701" class="moss">A</text>
    </g>
    <text x="374" y="702" text-anchor="end" class="moss" font-size="13" font-weight="600">tutti</text>

    <text x="16" y="744" class="ink" font-size="14" font-weight="600">Lovarini</text>
    <g font-size="11" text-anchor="middle" font-weight="600">
      <circle cx="112" cy="739" r="12" fill="#FBF8F2" stroke="#A8532A" stroke-width="1.3" stroke-dasharray="3 2.4"/><text x="112" y="743" class="kaki">G</text>
      <circle cx="142" cy="739" r="12" fill="#EEF0E4" stroke="#56663A" stroke-width="1.2"/><text x="142" y="743" class="moss">E</text>
      <circle cx="172" cy="739" r="12" fill="#EEF0E4" stroke="#56663A" stroke-width="1.2"/><text x="172" y="743" class="moss">P</text>
      <circle cx="202" cy="739" r="12" fill="#EEF0E4" stroke="#56663A" stroke-width="1.2"/><text x="202" y="743" class="moss">C</text>
    </g>
    <text x="374" y="744" text-anchor="end" class="kaki" font-size="13" font-weight="600">manca Giulia R.</text>

    <text x="16" y="786" class="ink" font-size="14" font-weight="600">Pulci</text>
    <g font-size="11" text-anchor="middle" font-weight="600">
      <circle cx="112" cy="781" r="12" fill="#EEF0E4" stroke="#56663A" stroke-width="1.2"/><text x="112" y="785" class="moss">T</text>
      <circle cx="142" cy="781" r="12" fill="#EEF0E4" stroke="#56663A" stroke-width="1.2"/><text x="142" y="785" class="moss">I</text>
      <circle cx="172" cy="781" r="12" fill="#EEF0E4" stroke="#56663A" stroke-width="1.2"/><text x="172" y="785" class="moss">F</text>
      <circle cx="202" cy="781" r="12" fill="#EEF0E4" stroke="#56663A" stroke-width="1.2"/><text x="202" y="785" class="moss">M</text>
    </g>
    <text x="374" y="786" text-anchor="end" class="moss" font-size="13" font-weight="600">tutti</text>

    <circle cx="22" cy="812" r="5" fill="#EEF0E4" stroke="#56663A" stroke-width="1.1"/>
    <text x="32" y="816" class="ink2" font-size="11.5">pagato</text>
    <circle cx="88" cy="812" r="5" fill="#FBF8F2" stroke="#A8532A" stroke-width="1.1" stroke-dasharray="2 1.6"/>
    <text x="98" y="816" class="ink2" font-size="11.5">non ancora arrivato</text>
  </g>

  <rect x="128" y="828" width="134" height="5" rx="2.5" fill="#2B2620"/>

  <rect width="390" height="844" filter="url(#paperLow)" pointer-events="none"/>
  <rect width="390" height="844" filter="url(#paper)" pointer-events="none"/>
</svg>
